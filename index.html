<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARES-IV | Astronaut Self-Health Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #060a12;
      --bg-card: #0c121e;
      --bg-card-hover: #111a2b;
      --border-subtle: #1b263b;
      --cyan-accent: #00e5ff;
      --amber-accent: #f59e0b;
      --emerald-accent: #10b981;
      --rose-accent: #f43f5e;
    }
    body {
      background-color: var(--bg-base);
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.05) 0%, transparent 60%),
        linear-gradient(rgba(27, 38, 59, 0.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(27, 38, 59, 0.25) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
    }
    .font-mono-tech {
      font-family: 'JetBrains Mono', monospace;
    }
    .panel-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    .panel-card:hover {
      border-color: #2c3e5e;
    }
    .hazard-active {
      background: linear-gradient(145deg, rgba(245, 158, 11, 0.12), rgba(12, 18, 30, 0.95));
      border-color: rgba(245, 158, 11, 0.65) !important;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.08);
    }
    .metric-active {
      border-color: #00e5ff !important;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.12);
    }
    input[type="range"] {
      accent-color: #00e5ff;
    }
    .hotspot-pulse {
      animation: pulseRing 2.2s infinite;
    }
    @keyframes pulseRing {
      0% { r: 6; opacity: 0.9; }
      70% { r: 14; opacity: 0; }
      100% { r: 6; opacity: 0; }
    }
  </style>
</head>
<body class="min-h-screen p-3 md:p-5 text-xs md:text-sm selection:bg-cyan-500/30">

  <div class="max-w-5xl mx-auto space-y-4">

    <!-- TOP MISSION TELEMETRY HEADER -->
    <header class="panel-card p-3.5 md:p-4 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-cyan-500/10 border border-cyan-500/40 flex items-center justify-center text-cyan-400 font-mono-tech font-bold">
            +
          </div>
          <div>
            <h1 class="font-mono-tech font-bold text-sm md:text-base tracking-wider text-white">
              ARES-IV <span class="text-slate-500">|</span> ASTRONAUT SELF-HEALTH MONITOR
            </h1>
            <div class="flex flex-wrap items-center gap-3 text-[11px] font-mono-tech text-slate-400 mt-0.5">
              <span>📡 EARTH DELAY: <strong id="earth-delay" class="text-cyan-400">10.4 MIN</strong></span>
              <span>🔥 <strong id="streak-count" class="text-amber-400">18D STREAK</strong></span>
              <span>⚡ <strong id="xp-display" class="text-emerald-400">1420 XP</strong></span>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <div class="px-2.5 py-1 rounded bg-cyan-950/60 border border-cyan-500/40 font-mono-tech text-[11px] text
